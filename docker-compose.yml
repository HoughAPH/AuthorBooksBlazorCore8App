# Runs the whole demo (SQL Server + API + Blazor client) without installing .NET or SQL Server:
#   cp .env.example .env   # then fill in JWT_KEY and ADMIN_PASSWORD
#   docker compose up --build
# Client: http://localhost:8081   API + Swagger-less health: http://localhost:8080/health
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=AuthorBooksDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Database__MigrateOnStartup: "true"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (32+ characters)}
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@example.com}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Cors__AllowedOrigins__0: http://localhost:8081
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    depends_on:
      - api
    volumes:
      # Points the browser app at the API published on the host.
      - ./docker/client-appsettings.json:/usr/share/nginx/html/appsettings.json:ro
    ports:
      - "8081:80"

volumes:
  sqldata:
