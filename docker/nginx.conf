server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WebAssembly: unknown paths fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the app shell, so a new deployment is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
